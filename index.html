<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050506">
  <title>Live Translator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050506;
      --panel: #111114;
      --panel-soft: #17171b;
      --line: rgba(255, 255, 255, 0.11);
      --text: #f7f7f8;
      --muted: rgba(247, 247, 248, 0.64);
      --dim: rgba(247, 247, 248, 0.42);
      --red: #ff3b30;
      --red-deep: #c91416;
      --blue: #64d2ff;
      --green: #5de58b;
      --shadow: rgba(0, 0, 0, 0.5);
      --divider: rgba(255, 255, 255, 0.88);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Segoe UI, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    .lock-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: max(22px, var(--safe-top)) max(22px, var(--safe-right)) max(22px, var(--safe-bottom)) max(22px, var(--safe-left));
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.13), transparent 30%),
        linear-gradient(180deg, #16171b 0%, #050506 72%);
    }

    .lock-panel {
      width: min(390px, 100%);
      display: grid;
      gap: 20px;
      text-align: center;
    }

    .lock-mark {
      width: 74px;
      height: 74px;
      margin: 0 auto 4px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.06));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 22px 52px var(--shadow);
    }

    .lock-panel h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 720;
    }

    .lock-panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 15px;
    }

    .password-row {
      display: grid;
      grid-template-columns: 1fr 52px;
      gap: 10px;
      margin-top: 8px;
    }

    .password-row input {
      width: 100%;
      min-width: 0;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      outline: none;
    }

    .password-row input:focus {
      border-color: rgba(100, 210, 255, 0.75);
      box-shadow: 0 0 0 4px rgba(100, 210, 255, 0.12);
    }

    .unlock-button {
      height: 52px;
      border-radius: 16px;
      background: #f4f4f5;
      color: #09090b;
      display: grid;
      place-items: center;
    }

    .lock-error {
      min-height: 20px;
      margin-top: -6px;
      color: #ff9f9a;
      font-size: 13px;
    }

    .app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: 1fr 1fr;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(180deg, #0e0e11, #050506);
      background-size: 28px 28px, 100% 100%;
    }

    .app::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 6px;
      z-index: 4;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.3), var(--divider), rgba(255, 255, 255, 0.3)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.42));
      box-shadow:
        0 -1px 0 rgba(255, 255, 255, 0.8),
        0 1px 0 rgba(255, 255, 255, 0.36),
        0 0 22px rgba(255, 255, 255, 0.46),
        0 0 44px rgba(255, 255, 255, 0.18);
      transform: translateY(-50%);
    }

    .app.locked {
      visibility: hidden;
    }

    .side {
      min-height: 0;
      position: relative;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08), transparent 38%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.018));
    }

    .side.top {
      transform: rotate(180deg);
    }

    .side.bottom {
      padding-bottom: var(--safe-bottom);
    }

    .top .side-shell {
      padding: calc(13px + var(--safe-bottom)) calc(14px + var(--safe-left)) 12px calc(14px + var(--safe-right));
    }

    .bottom .side-shell {
      padding: 12px calc(14px + var(--safe-right)) calc(13px + var(--safe-bottom)) calc(14px + var(--safe-left));
    }

    .side-shell {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 8px;
      overflow: hidden;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.075);
      color: var(--text);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .icon-button:active {
      transform: scale(0.97);
    }

    .center-menu-button {
      position: absolute;
      z-index: 7;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 10px 28px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .center-menu-button {
      left: calc(12px + var(--safe-left));
      top: 50%;
      transform: translateY(-50%);
    }

    .top-language-overlay {
      position: absolute;
      left: calc(14px + var(--safe-left));
      top: calc(33px + var(--safe-top));
      z-index: 7;
      transform: rotate(180deg);
    }

    .top-cancel-overlay {
      position: absolute;
      right: calc(14px + var(--safe-right));
      top: calc(33px + var(--safe-top));
      z-index: 7;
      transform: rotate(180deg) translateY(4px);
    }

    .top-cancel-overlay.visible {
      transform: rotate(180deg) translateY(0);
    }

    .floating-language-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 10px 28px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .chat {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 2px 2px 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      overscroll-behavior: contain;
    }

    .chat::-webkit-scrollbar {
      width: 4px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
    }

    .empty-state {
      flex: 1;
      display: grid;
      place-items: center;
      color: rgba(247, 247, 248, 0.34);
      text-align: center;
      font-size: 14px;
      line-height: 1.35;
      padding: 18px;
    }

    .message {
      align-self: flex-start;
      max-width: min(82%, 560px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      gap: 8px;
      align-items: center;
      padding: 10px 10px 10px 14px;
      border-radius: 20px 20px 20px 6px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: messageIn 180ms ease-out;
    }

    .message.own {
      align-self: flex-end;
      border-radius: 20px 20px 6px 20px;
      background: linear-gradient(180deg, rgba(100, 210, 255, 0.32), rgba(100, 210, 255, 0.18));
    }

    .message-text {
      min-width: 0;
      line-height: 1.28;
      font-size: clamp(15px, 3.9vw, 18px);
      overflow-wrap: anywhere;
    }

    .replay-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      opacity: 0.92;
    }

    .replay-button:active {
      transform: scale(0.94);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 10px;
      min-height: 82px;
      position: relative;
    }

    .side-actions {
      justify-self: start;
      align-self: center;
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 42px;
    }

    .cancel-area {
      grid-column: 3;
      justify-self: end;
      align-self: center;
      min-width: 42px;
      display: flex;
      justify-content: flex-end;
    }

    .record-wrap {
      grid-column: 2;
      position: relative;
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
    }

    .record-button {
      position: relative;
      z-index: 2;
      width: 68px;
      height: 68px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #ff6a61 0%, var(--red) 46%, var(--red-deep) 100%);
      box-shadow:
        0 18px 36px rgba(255, 59, 48, 0.28),
        inset 0 2px 2px rgba(255, 255, 255, 0.28),
        inset 0 -5px 10px rgba(0, 0, 0, 0.22);
      transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
    }

    .record-button:active {
      transform: scale(0.96);
    }

    .record-button:disabled {
      opacity: 0.28;
      filter: grayscale(0.8);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .record-button .stop-icon {
      display: none;
      width: 25px;
      height: 25px;
      border-radius: 7px;
      background: #fff;
    }

    .record-button .record-dot {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.55);
    }

    .record-button.is-recording .record-dot {
      display: none;
    }

    .record-button.is-recording .stop-icon {
      display: block;
    }

    .intake-field {
      position: absolute;
      inset: -48px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      z-index: 1;
    }

    .record-wrap.is-recording .intake-field {
      opacity: 1;
    }

    .intake-field span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow:
        0 0 18px rgba(100, 210, 255, 0.82),
        0 0 38px rgba(255, 255, 255, 0.28);
      animation: intake 1.05s cubic-bezier(0.36, 0, 0.26, 1) infinite;
    }

    .side.bottom .intake-field span:nth-child(1) { --x: -62px; --y: 62px; animation-delay: 0ms; }
    .side.bottom .intake-field span:nth-child(2) { --x: -28px; --y: 74px; animation-delay: 90ms; }
    .side.bottom .intake-field span:nth-child(3) { --x: 34px; --y: 70px; animation-delay: 180ms; }
    .side.bottom .intake-field span:nth-child(4) { --x: 68px; --y: 54px; animation-delay: 270ms; }
    .side.bottom .intake-field span:nth-child(5) { --x: -4px; --y: 88px; animation-delay: 360ms; }
    .side.bottom .intake-field span:nth-child(6) { --x: 8px; --y: 66px; animation-delay: 450ms; }

    .side.top .intake-field span:nth-child(1) { --x: -62px; --y: 62px; animation-delay: 0ms; }
    .side.top .intake-field span:nth-child(2) { --x: -28px; --y: 74px; animation-delay: 90ms; }
    .side.top .intake-field span:nth-child(3) { --x: 34px; --y: 70px; animation-delay: 180ms; }
    .side.top .intake-field span:nth-child(4) { --x: 68px; --y: 54px; animation-delay: 270ms; }
    .side.top .intake-field span:nth-child(5) { --x: -4px; --y: 88px; animation-delay: 360ms; }
    .side.top .intake-field span:nth-child(6) { --x: 8px; --y: 66px; animation-delay: 450ms; }

    .cancel-button {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.86);
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .cancel-button.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .cancel-button img {
      width: 19px;
      height: 19px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .cancel-button.top-cancel-overlay {
      transform: rotate(180deg) translateY(4px);
    }

    .cancel-button.top-cancel-overlay.visible {
      transform: rotate(180deg) translateY(0);
    }

    .processing-wash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.07), transparent);
      transform: translateX(-100%);
      transition: opacity 150ms ease;
      z-index: -1;
    }

    .side.is-processing .processing-wash {
      opacity: 1;
      animation: sweep 1.1s ease-in-out infinite;
    }

    .menu-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: none;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .menu-backdrop.open {
      display: block;
    }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      width: min(340px, calc(100vw - 38px));
      padding: calc(18px + var(--safe-top)) 16px calc(18px + var(--safe-bottom)) calc(16px + var(--safe-left));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 20px;
      background: rgba(22, 22, 25, 0.9);
      border-right: 1px solid var(--line);
      box-shadow: 28px 0 70px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      transform: translateX(-104%);
      transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-content {
      display: grid;
      align-content: start;
      gap: 18px;
      overflow: hidden;
    }

    .menu-section {
      display: grid;
      gap: 9px;
    }

    .menu-section h2 {
      margin: 0;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 760;
    }

    .select-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .select-row label {
      color: var(--muted);
      font-size: 13px;
    }

    .select-row select {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      outline: none;
    }

    .menu-action {
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: rgba(255, 255, 255, 0.09);
      font-weight: 660;
    }

    .unsupported {
      display: none;
      color: #ffd2cf;
      font-size: 13px;
      line-height: 1.4;
      padding: 10px 12px;
      border: 1px solid rgba(255, 59, 48, 0.24);
      border-radius: 14px;
      background: rgba(255, 59, 48, 0.09);
    }

    .unsupported.visible {
      display: block;
    }

    .recording-notice {
      position: fixed;
      left: 50%;
      bottom: calc(22px + var(--safe-bottom));
      z-index: 30;
      width: min(420px, calc(100vw - 28px));
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: rgba(24, 24, 27, 0.9);
      color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .recording-notice.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes intake {
      0% {
        transform: translate(var(--x), var(--y)) scale(1);
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      82% {
        opacity: 0.86;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 0;
      }
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes sweep {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(100%);
      }
    }

    @media (min-width: 760px) {
      .app {
        width: min(520px, 100vw);
        left: 50%;
        transform: translateX(-50%);
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
        box-shadow: 0 0 80px rgba(0, 0, 0, 0.55);
      }

      body {
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.06), transparent 36%),
          #050506;
      }
    }

    @media (max-height: 620px) {
      .side-shell {
        gap: 7px;
      }

      .icon-button {
        width: 36px;
        height: 36px;
      }

      .controls {
        min-height: 72px;
      }

      .record-wrap {
        width: 66px;
        height: 66px;
      }

      .record-button {
        width: 58px;
        height: 58px;
      }

      .record-button .record-dot {
        width: 22px;
        height: 22px;
      }

      .record-button .stop-icon {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="app locked" aria-label="Live Translator">
    <button class="center-menu-button" type="button" id="centerMenu" aria-label="Open menu">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="floating-language-button top-language-overlay" type="button" data-language-button="top" aria-label="Upper language">🇬🇧</button>
    <button class="cancel-button top-cancel-overlay" type="button" data-cancel="top" aria-label="Cancel recording">
      <img src="assets/icon_bin.png" alt="" aria-hidden="true">
    </button>
    <section class="side top" data-side="top">
      <div class="processing-wash"></div>
      <div class="side-shell">
        <div class="chat" data-chat="top" aria-live="polite">
          <div class="empty-state" data-empty="top">Conversation appears here</div>
        </div>

        <div class="controls">
          <div class="side-actions">
          </div>
          <div class="record-wrap" data-record-wrap="top">
            <div class="intake-field" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <button class="record-button" type="button" data-record="top" aria-label="Start recording">
              <span class="record-dot" aria-hidden="true"></span>
              <span class="stop-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div></div>
        </div>
      </div>
    </section>

    <section class="side bottom" data-side="bottom">
      <div class="processing-wash"></div>
      <div class="side-shell">
        <div class="chat" data-chat="bottom" aria-live="polite">
          <div class="empty-state" data-empty="bottom">Gespräch erscheint hier</div>
        </div>

        <div class="controls">
          <div class="side-actions">
            <button class="floating-language-button" type="button" data-language-button="bottom" aria-label="Lower language">🇩🇪</button>
          </div>
          <div class="record-wrap" data-record-wrap="bottom">
            <div class="intake-field" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <button class="record-button" type="button" data-record="bottom" aria-label="Start recording">
              <span class="record-dot" aria-hidden="true"></span>
              <span class="stop-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="cancel-area">
            <button class="cancel-button" type="button" data-cancel="bottom" aria-label="Cancel recording">
              <img src="assets/icon_bin.png" alt="" aria-hidden="true">
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <section id="lockScreen" class="lock-screen" aria-label="Unlock">
    <form class="lock-panel" id="lockForm">
      <div class="lock-mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24">
          <path d="M7 10V8a5 5 0 0 1 10 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <rect x="5" y="10" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <h1>Live Translator</h1>
      <div class="password-row">
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
        <button class="unlock-button" type="submit" aria-label="Unlock">
          <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="lock-error" id="lockError" aria-live="polite"></div>
    </form>
  </section>

  <div class="menu-backdrop" id="menuBackdrop"></div>
  <div class="recording-notice" id="recordingNotice" role="status" aria-live="polite"></div>
  <aside class="drawer" id="drawer" aria-label="Settings menu" aria-hidden="true">
    <div class="drawer-header">
      <div></div>
      <button class="icon-button" type="button" id="closeMenu" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="drawer-content">
      <button class="menu-action" type="button" id="newChat">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        New Chat
      </button>

      <section class="menu-section">
        <div class="select-row">
          <label for="topLanguage">Upper side</label>
          <select id="topLanguage">
            <option value="en">English 🇬🇧</option>
            <option value="de">Deutsch 🇩🇪</option>
            <option value="it">Italiano 🇮🇹</option>
            <option value="vi">Tiếng Việt 🇻🇳</option>
          </select>
        </div>
        <div class="select-row">
          <label for="bottomLanguage">Lower side</label>
          <select id="bottomLanguage">
            <option value="de">Deutsch 🇩🇪</option>
            <option value="en">English 🇬🇧</option>
            <option value="it">Italiano 🇮🇹</option>
            <option value="vi">Tiếng Việt 🇻🇳</option>
          </select>
        </div>
      </section>

      <div class="unsupported" id="unsupportedMessage"></div>
    </div>
  </aside>

  <script>
    const APP_PASSWORD = "helpme";

    const languages = {
      de: { name: "Deutsch", locale: "de-DE", flag: "🇩🇪", empty: "Gespräch erscheint hier" },
      en: { name: "English", locale: "en-GB", flag: "🇬🇧", empty: "Conversation appears here" },
      it: { name: "Italiano", locale: "it-IT", flag: "🇮🇹", empty: "La conversazione appare qui" },
      vi: { name: "Tiếng Việt", locale: "vi-VN", flag: "🇻🇳", empty: "Cuộc trò chuyện xuất hiện ở đây" }
    };

    const demoTranslations = {
      de: "Hallo, wie geht es dir?",
      en: "Hello, how are you?",
      it: "Ciao, come stai?",
      vi: "Xin chào, bạn khỏe không?"
    };

    const state = {
      unlocked: false,
      activeSide: null,
      recorder: null,
      stream: null,
      chunks: [],
      supportError: "",
      topLanguage: "en",
      bottomLanguage: "de",
      messages: {
        top: [],
        bottom: []
      }
    };

    const app = document.getElementById("app");
    const lockScreen = document.getElementById("lockScreen");
    const lockForm = document.getElementById("lockForm");
    const passwordInput = document.getElementById("passwordInput");
    const lockError = document.getElementById("lockError");
    const drawer = document.getElementById("drawer");
    const menuBackdrop = document.getElementById("menuBackdrop");
    const unsupportedMessage = document.getElementById("unsupportedMessage");
    const recordingNotice = document.getElementById("recordingNotice");

    const recordButtons = {
      top: document.querySelector('[data-record="top"]'),
      bottom: document.querySelector('[data-record="bottom"]')
    };

    const cancelButtons = {
      top: document.querySelector('[data-cancel="top"]'),
      bottom: document.querySelector('[data-cancel="bottom"]')
    };

    const recordWraps = {
      top: document.querySelector('[data-record-wrap="top"]'),
      bottom: document.querySelector('[data-record-wrap="bottom"]')
    };

    const chats = {
      top: document.querySelector('[data-chat="top"]'),
      bottom: document.querySelector('[data-chat="bottom"]')
    };

    const preferredMimeTypes = [
      "audio/mp4;codecs=mp4a.40.2",
      "audio/mp4;codecs=mp4a",
      "audio/mp4",
      "audio/aac",
      "audio/x-m4a",
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mpeg",
      "audio/wav"
    ];

    function oppositeSide(side) {
      return side === "top" ? "bottom" : "top";
    }

    function languageForSide(side) {
      return state[side + "Language"];
    }

    function setStatus(side, label, detail) {
      const status = document.querySelector(`[data-status="${side}"]`);
      const substatus = document.querySelector(`[data-substatus="${side}"]`);
      if (status) {
        status.textContent = label;
      }
      if (substatus) {
        substatus.textContent = detail;
      }
    }

    function chooseMimeType() {
      if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) {
        return "";
      }
      return preferredMimeTypes.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function showRecordingNotice(message) {
      recordingNotice.textContent = message;
      recordingNotice.classList.add("visible");
      window.clearTimeout(showRecordingNotice.timeout);
      showRecordingNotice.timeout = window.setTimeout(() => {
        recordingNotice.classList.remove("visible");
      }, 4200);
    }

    function createMediaRecorder(stream) {
      const mimeType = chooseMimeType();
      if (mimeType) {
        try {
          return new MediaRecorder(stream, { mimeType });
        } catch (error) {
          // Safari can report support but still reject the explicit MIME type.
        }
      }
      return new MediaRecorder(stream);
    }

    function updateSupportStatus() {
      const hasMedia = Boolean(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      const hasRecorder = Boolean(window.MediaRecorder);

      if (!hasMedia) {
        state.supportError = window.isSecureContext
          ? "This browser does not expose microphone recording."
          : "Microphone recording requires HTTPS on iPhone and most mobile browsers.";
      } else if (!hasRecorder) {
        state.supportError = "This browser does not support MediaRecorder.";
      } else {
        state.supportError = "";
      }

      unsupportedMessage.textContent = state.supportError;
      unsupportedMessage.classList.toggle("visible", Boolean(state.supportError));

      if (state.supportError) {
        setStatus("top", "Error", "Recording unavailable");
        setStatus("bottom", "Error", "Recording unavailable");
      }
    }

    function updateLanguageLabels() {
      ["top", "bottom"].forEach((side) => {
        const lang = languages[languageForSide(side)];
        const button = document.querySelector(`[data-language-button="${side}"]`);
        if (button) {
          button.textContent = lang.flag;
          button.setAttribute("aria-label", `${side === "top" ? "Upper" : "Lower"} language: ${lang.name}`);
        }
        const empty = document.querySelector(`[data-empty="${side}"]`);
        if (empty) {
          empty.textContent = lang.empty;
        }
      });
    }

    function renderChat(side) {
      chats[side].innerHTML = "";

      if (!state.messages[side].length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.dataset.empty = side;
        empty.textContent = languages[languageForSide(side)].empty;
        chats[side].append(empty);
        return;
      }

      state.messages[side].forEach((message) => {
        const item = document.createElement("article");
        item.className = "message " + (message.side === side ? "own" : "");

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = message.text;

        const replay = document.createElement("button");
        replay.className = "replay-button";
        replay.type = "button";
        replay.setAttribute("aria-label", "Replay message");
        replay.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 4.5a4 4 0 0 1 0 5m3-8a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        replay.addEventListener("click", () => speak(message.text, languages[message.lang].locale));

        item.append(text, replay);
        chats[side].append(item);
      });

      chats[side].scrollTop = chats[side].scrollHeight;
    }

    function setRecordingUi(side, isRecording) {
      const other = oppositeSide(side);

      recordButtons[side].classList.toggle("is-recording", isRecording);
      recordButtons[side].setAttribute("aria-label", isRecording ? "Stop recording" : "Start recording");
      recordWraps[side].classList.toggle("is-recording", isRecording);
      cancelButtons[side].classList.toggle("visible", isRecording);
      recordButtons[other].disabled = isRecording;

      if (isRecording) {
        setStatus(side, "Recording", "Listening");
        setStatus(other, "Waiting", "Recording disabled");
      } else {
        recordButtons[other].disabled = false;
        setStatus(side, "Ready", "Tap to record");
        setStatus(other, "Ready", "Tap to record");
      }
    }

    function setProcessing(side, isProcessing) {
      document.querySelector(`[data-side="${side}"]`).classList.toggle("is-processing", isProcessing);
      setStatus(side, isProcessing ? "Processing" : "Ready", isProcessing ? "Transcribing" : "Tap to record");
    }

    async function startRecording(side) {
      if (state.supportError) {
        setStatus(side, "Error", "Recording unavailable");
        showRecordingNotice(state.supportError);
        return;
      }

      if (state.activeSide) {
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        state.recorder = createMediaRecorder(stream);
        state.stream = stream;
        state.chunks = [];
        state.activeSide = side;

        state.recorder.addEventListener("dataavailable", (event) => {
          if (event.data && event.data.size > 0) {
            state.chunks.push(event.data);
          }
        });

        state.recorder.addEventListener("stop", () => {
          state.stream?.getTracks().forEach((track) => track.stop());
          state.stream = null;
        }, { once: true });

        state.recorder.start();
        setRecordingUi(side, true);
      } catch (error) {
        state.stream?.getTracks().forEach((track) => track.stop());
        state.stream = null;
        const message = error && error.name === "NotAllowedError"
          ? "Microphone permission was denied. Please allow microphone access in Safari settings."
          : "Microphone recording could not be started on this browser.";
        setStatus(side, "Error", "Microphone blocked");
        showRecordingNotice(message);
      }
    }

    function stopRecording(side) {
      if (state.activeSide !== side || !state.recorder) {
        return;
      }

      state.recorder.stop();
      state.recorder = null;
      state.activeSide = null;
      setRecordingUi(side, false);
      simulateProcessing(side);
    }

    function cancelRecording(side) {
      if (state.activeSide !== side) {
        return;
      }

      if (state.recorder && state.recorder.state !== "inactive") {
        state.recorder.stop();
      }

      state.recorder = null;
      state.activeSide = null;
      state.chunks = [];
      state.stream?.getTracks().forEach((track) => track.stop());
      state.stream = null;
      setRecordingUi(side, false);
    }

    function simulateProcessing(sourceSide) {
      const targetSide = oppositeSide(sourceSide);
      const sourceLang = languageForSide(sourceSide);
      const targetLang = languageForSide(targetSide);
      const sourceText = demoTranslations[sourceLang];
      const targetText = demoTranslations[targetLang];

      setProcessing(sourceSide, true);
      setStatus(targetSide, "Translating", "Receiving message");

      window.setTimeout(() => {
        state.messages[sourceSide].push({
          side: sourceSide,
          lang: sourceLang,
          text: sourceText
        });
        state.messages[targetSide].push({
          side: sourceSide,
          lang: targetLang,
          text: targetText
        });

        renderChat(sourceSide);
        renderChat(targetSide);
        setProcessing(sourceSide, false);
        setStatus(targetSide, "Ready", "Tap to record");
        speak(targetText, languages[targetLang].locale);
      }, 760);
    }

    function speak(text, locale) {
      if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = locale;

      const voices = window.speechSynthesis.getVoices();
      const languagePrefix = locale.split("-")[0].toLowerCase();
      const matchingVoice = voices.find((voice) => voice.lang.toLowerCase() === locale.toLowerCase())
        || voices.find((voice) => voice.lang.toLowerCase().startsWith(languagePrefix));

      if (matchingVoice) {
        utterance.voice = matchingVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function openMenu() {
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      menuBackdrop.classList.add("open");
    }

    function closeMenu() {
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      menuBackdrop.classList.remove("open");
    }

    function resetChat() {
      state.messages.top = [];
      state.messages.bottom = [];
      renderChat("top");
      renderChat("bottom");
      closeMenu();
    }

    function hasConversation() {
      return state.messages.top.length > 0 || state.messages.bottom.length > 0;
    }

    function applyLanguageChange(side, value, selectElement) {
      const stateKey = side + "Language";
      if (state[stateKey] === value) {
        return;
      }

      if (hasConversation()) {
        const shouldStartNew = window.confirm("Changing the language starts a new chat. Continue?");
        if (!shouldStartNew) {
          selectElement.value = state[stateKey];
          return;
        }
        state.messages.top = [];
        state.messages.bottom = [];
      }

      state[stateKey] = value;
      updateLanguageLabels();
      renderChat("top");
      renderChat("bottom");
    }

    lockForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (passwordInput.value === APP_PASSWORD) {
        state.unlocked = true;
        lockScreen.style.display = "none";
        app.classList.remove("locked");
        passwordInput.value = "";
      } else {
        lockError.textContent = "Wrong password.";
        passwordInput.select();
      }
    });

    document.getElementById("centerMenu").addEventListener("click", openMenu);
    document.querySelectorAll("[data-language-button]").forEach((button) => {
      button.addEventListener("click", openMenu);
    });

    document.getElementById("closeMenu").addEventListener("click", closeMenu);
    menuBackdrop.addEventListener("click", closeMenu);
    document.getElementById("newChat").addEventListener("click", resetChat);

    document.getElementById("topLanguage").addEventListener("change", (event) => {
      applyLanguageChange("top", event.target.value, event.target);
    });

    document.getElementById("bottomLanguage").addEventListener("change", (event) => {
      applyLanguageChange("bottom", event.target.value, event.target);
    });

    ["top", "bottom"].forEach((side) => {
      recordButtons[side].addEventListener("click", () => {
        if (state.activeSide === side) {
          stopRecording(side);
        } else {
          startRecording(side);
        }
      });

      cancelButtons[side].addEventListener("click", () => cancelRecording(side));
    });

    window.speechSynthesis?.addEventListener?.("voiceschanged", () => {});
    updateSupportStatus();
    updateLanguageLabels();
    renderChat("top");
    renderChat("bottom");
  </script>
</body>
</html>
